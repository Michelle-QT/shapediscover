[build-system]
requires = ["setuptools >= 65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shapediscover"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Luis Scoccola", email = "luis.scoccola@gmail.com" },
    { name = "Uzu Lim" },
]
maintainers = [{ name = "Luis Scoccola", email = "luis.scoccola@gmail.com" }]

requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "scikit-learn",
    "torch",
    "umap-learn",
    "gudhi",
    "fufpy",
]


[project.optional-dependencies]
# nerve visualization (plot_nerve, interactive layout)
viz = ["pyvis", "glasbey", "networkx"]
# the optional graph-neural-network model (model="graph_nn")
nn = ["torch_geometric"]
# libraries used by some of the example notebooks
extras = ["kmapper", "ripser", "torchvision", "scikit-fuzzy", "pandas"]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "shapediscover._version.__version__" }

[tool.setuptools.packages.find]
include = ["shapediscover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
