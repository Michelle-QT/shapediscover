name: tests

on:
  push:
  pull_request:

jobs:
  # core install: the viz / nn extras are absent, so the plotting and graph_nn
  # tests skip (they importorskip their optional dependencies)
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]"
      - run: pytest

  # full install: viz + nn extras present, so the whole suite runs
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test,viz,nn]"
      - run: pytest
